<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">
<head>
<title>TxBank - Verification code</title>
<link rel="stylesheet" href="/css/codeVerification.css">
</head>
<body>
	<div class="header"></div>

	<div class="container">
		<div class="card">
			<h1>Verification Code</h1>
			<form th:action="@{/register}" method="post">
				<div>
					<label> Verification Code(Email): <input type="text"
						name="code" required />
					</label>
				</div>
				<div>
					<input type="hidden" name="login" th:value="${login}" />
					<input type="submit" value="Register" />
				</div>
			</form>
			<div class="back-button">
				<button onclick="window.location.href='/welcome'">Back to Welcome</button>
			</div>
		</div>

		<div class="info-card">
			<h2>What's Verification code?</h2>
			<p>To complete the process, confirm your email by entering the
				verification code below. If you haven't received the email with the
				code, check your spam folder or request a resend.</p>
		</div>
	</div>

	<div class="footer"></div>
</body>
</html>
